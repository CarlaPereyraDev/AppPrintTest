trigger:
- main

pool:
  vmImage: 'windows-latest'

variables:
  buildConfiguration: 'Release'
  # Asegúrate de que este nombre coincida con el .sln que vimos en tu repo
  solutionPath: 'appImprimir.sln' 

steps:
# 1. Instalar el SDK específico (net6.0)
- task: UseDotNet@2
  displayName: 'Instalar SDK .NET 6.0'
  inputs:
    packageType: 'sdk'
    version: '6.x'

# 2. Restaurar paquetes (Ahora con la versión correcta del SDK)
- task: DotNetCoreCLI@2
  displayName: 'Restore de dependencias'
  inputs:
    command: 'restore'
    projects: '$(solutionPath)'

# 3. Compilación y Análisis Estático
# Aquí es donde Roslyn revisará tu código basándose en el .csproj
- task: DotNetCoreCLI@2
  displayName: 'Build y Análisis de Código'
  inputs:
    command: 'build'
    projects: '$(solutionPath)'
    arguments: '--configuration $(buildConfiguration)'
