trigger:
- main

pool:
  vmImage: 'windows-latest'

variables:
  buildConfiguration: 'Release'
  solutionPath: 'appImprimir.sln'

steps:
# 1. Forzar la versión correcta de .NET
- task: UseDotNet@2
  displayName: 'Instalar SDK de .NET'
  inputs:
    packageType: 'sdk'
    version: '8.x' # Si el proyecto es más viejo, prueba con '6.x'

# 2. Restore con Verbosity para ver qué falla exactamente
- task: DotNetCoreCLI@2
  displayName: 'Restore de paquetes'
  inputs:
    command: 'restore'
    projects: '$(solutionPath)'
    feedsToUse: 'select' # Usa los feeds estándar de NuGet

# 3. Compilación con análisis de Roslyn
- task: DotNetCoreCLI@2
  displayName: 'Build y Análisis Roslyn'
  inputs:
    command: 'build'
    projects: '$(solutionPath)'
    # Activamos los analizadores y evitamos que falle por simples warnings
    arguments: '--configuration $(buildConfiguration) /p:EnableNETAnalyzers=true /p:AnalysisMode=All'
