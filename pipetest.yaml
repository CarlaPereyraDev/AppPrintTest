trigger:
- main

pool:
  vmImage: 'windows-latest'

variables:
  buildConfiguration: 'Release'
  solutionPath: 'appImprimir.sln'

steps:
# 1. Instalar el SDK de .NET (Asegúrate de usar la versión de tu proyecto)
- task: UseDotNet@2
  inputs:
    packageType: 'sdk'
    version: '8.x' # Cambia a 6.x o 7.x si es necesario

# 2. Restaurar dependencias
- task: DotNetCoreCLI@2
  displayName: 'Restore'
  inputs:
    command: 'restore'
    projects: '$(solutionPath)'

# 3. Compilación con Análisis de Roslyn
# Los errores y advertencias aparecerán en la pestaña "Issues" de la Pipeline
- task: DotNetCoreCLI@2
  displayName: 'Build & Analyze'
  inputs:
    command: 'build'
    projects: '$(solutionPath)'
    # Esto genera un archivo con los resultados del análisis
    arguments: '--configuration $(buildConfiguration) /warnaserror:false' 

# 4. (Opcional) Publicar resultados como artefactos si quieres descargarlos después
- task: PublishBuildArtifacts@1
  displayName: 'Publicar logs de compilación'
  inputs:
    PathtoPublish: '$(Build.ArtifactStagingDirectory)'
    ArtifactName: 'AnalysisLogs'
    publishLocation: 'Container'
